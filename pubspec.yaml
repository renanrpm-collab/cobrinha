name: snake_arcade
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  audioplayers: ^6.6.0
  google_mobile_ads: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_game.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/images/icon_game.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/